<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="/favicon-circle.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Redcircle - Turn viral Reddit posts to tradeable markets powered by Solana</title>
  </head>

  <body>
    <div id="app"></div>
    <script>
      try {
        var q = window.location.search;
        if (q && (q.indexOf("x=") !== -1 || q.indexOf("url=") !== -1)) {
          sessionStorage.setItem("rc_launch_search", q);
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
